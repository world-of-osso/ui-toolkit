[package]
name = "ui-toolkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
ui-toolkit-core = { path = "core" }
ui-toolkit-macros = { git = "ssh://git@github.com/world-of-osso/ui-toolkit-macros.git", rev = "1979e54" }
bevy = { version = "0.19", default-features = false, features = ["default"] }
image-blp = "1"
ab_glyph = "0.2"
# Native edit-box carets use Bevy's existing shaped-text cursor geometry.
parley = { version = "0.9", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
notify = "7"

[patch."ssh://git@github.com/world-of-osso/ui-toolkit-macros.git"]
ui-toolkit-macros = { path = "../ui-toolkit-macros" }

[profile.dev.package."*"]
opt-level = 2

